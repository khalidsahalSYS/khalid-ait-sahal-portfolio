<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#241a18" />
    <meta name="description" content="The online CV and portfolio of Khalid Ait Sahal." />
    <title>Khalid Ait Sahal | Online CV</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #fff8f0;
        --muted: #d7c6bb;
        --gold: #ffc46a;
        --glass: rgba(25, 20, 20, 0.72);
      }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        padding: 28px;
        display: grid;
        place-items: center;
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: linear-gradient(120deg, rgba(24,18,17,.42), rgba(24,18,17,.78)), url("assets/profile.jpg") center 42% / cover fixed, #493126;
      }
      .card {
        width: min(100%, 980px);
        min-height: 580px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        overflow: hidden;
        border: 1px solid rgba(255,255,255,.17);
        border-radius: 28px;
        background: var(--glass);
        box-shadow: 0 28px 90px rgba(0,0,0,.4);
        backdrop-filter: blur(16px);
      }
      .portrait { min-height: 400px; position: relative; overflow: hidden; background: #4a3023; }
      .portrait img { width: 100%; height: 100%; position: absolute; inset: 0; object-fit: cover; object-position: center; }
      .portrait::after { content: ""; position: absolute; inset: 40% 0 0; background: linear-gradient(transparent, rgba(12,10,10,.5)); }
      .content { padding: clamp(32px, 6vw, 72px); display: flex; flex-direction: column; justify-content: center; }
      .eyebrow { color: var(--gold); font-size: .75rem; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; }
      h1 { margin: 18px 0 12px; font-size: clamp(2.5rem, 5vw, 4.5rem); line-height: 1.02; letter-spacing: -.05em; }
      .subtitle { margin: 0; color: var(--muted); font-size: 1.05rem; }
      .rule { width: 54px; height: 3px; margin: 30px 0; border: 0; background: var(--gold); }
      .links { display: flex; flex-wrap: wrap; gap: 12px; }
      .link { display: inline-flex; align-items: center; gap: 10px; padding: 13px 18px; border: 1px solid rgba(255,255,255,.2); border-radius: 999px; color: var(--ink); text-decoration: none; font-weight: 650; transition: transform .18s ease, background .18s ease; }
      .link:hover { transform: translateY(-2px); background: rgba(255,255,255,.1); }
      .link.github { border-color: transparent; background: var(--gold); color: #281b13; }
      .link:focus-visible { outline: 3px solid white; outline-offset: 3px; }
      .footer { margin-top: 40px; color: #cbbab0; font-size: .88rem; }
      @media (max-width: 700px) {
        body { padding: 16px; background-attachment: scroll; }
        .card { grid-template-columns: 1fr; min-height: auto; }
        .portrait { min-height: 330px; }
        .content { padding: 34px 28px 38px; }
        .footer { margin-top: 30px; }
      }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; } }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="portrait">
        <img src="assets/profile.jpg" alt="Portrait chosen by Khalid Ait Sahal" />
      </div>
      <section class="content" aria-labelledby="name">
        <span class="eyebrow">Online CV</span>
        <h1 id="name">Khalid<br />Ait Sahal</h1>
        <p class="subtitle">Welcome to my profile.</p>
        <hr class="rule" />
        <nav class="links" aria-label="Profile links">
          <a class="link github" href="https://github.com/khalidsahalSYS" target="_blank" rel="noopener noreferrer" aria-label="Visit Khalid Ait Sahal on GitHub">
            <svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="currentColor"><path d="M12 .8a11.2 11.2 0 0 0-3.54 21.83c.56.1.76-.24.76-.54v-2.1c-3.1.67-3.76-1.32-3.76-1.32-.5-1.28-1.24-1.62-1.24-1.62-1.01-.69.08-.68.08-.68 1.12.08 1.71 1.15 1.71 1.15 1 1.7 2.62 1.2 3.26.92.1-.72.39-1.2.71-1.48-2.48-.28-5.09-1.24-5.09-5.52 0-1.22.44-2.22 1.15-3-.12-.28-.5-1.42.11-2.96 0 0 .94-.3 3.08 1.15a10.7 10.7 0 0 1 5.6 0c2.14-1.45 3.07-1.15 3.07-1.15.62 1.54.23 2.68.12 2.96.72.78 1.15 1.78 1.15 3 0 4.29-2.62 5.23-5.11 5.51.4.35.76 1.02.76 2.06v3.08c0 .3.2.65.77.54A11.2 11.2 0 0 0 12 .8Z"/></svg>
            GitHub profile
          </a>
        </nav>
        <p class="footer">Morocco</p>
      </section>
    </main>
  </body>
</html>
